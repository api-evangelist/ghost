modified: '2026-05-19'
specificationVersion: '0.19'
apis:
- aid: ghost:ghost-admin-api
  name: Ghost Admin API
  humanURL: https://docs.ghost.org/admin-api
  baseURL: https://{admin_domain}/ghost/api/admin
  tags:
  - Publishing
  - Content Management
  - Members
  - Newsletters
  - Webhooks
  description: >-
    The Ghost Admin API provides full read/write access to posts, pages, tags, tiers, newsletters, offers,
    members, users, images, themes, webhooks, and site configuration. Authentication uses short-lived
    JWTs derived from an admin API key, staff access tokens, or session cookies. Requests must include
    an Accept-Version header.
  properties:
  - type: Documentation
    url: https://docs.ghost.org/admin-api
  - type: Authentication
    url: https://docs.ghost.org/admin-api#token-authentication
  - type: Webhooks
    url: https://docs.ghost.org/webhooks
  - type: SDKs
    title: Ghost Admin Node SDK
    url: https://github.com/TryGhost/SDK/tree/main/packages/admin-api
  - url: graphql/ghost-graphql.md
    type: GraphQL
- aid: ghost:ghost-content-api
  name: Ghost Content API
  humanURL: https://docs.ghost.org/content-api
  baseURL: https://{admin_domain}/ghost/api/content
  tags:
  - Publishing
  - Content
  - Read Only
  - Public
  description: >-
    The Ghost Content API is a read-only RESTful API for delivering published content (posts, pages, tags,
    authors, tiers, settings) to clients. It uses query-parameter Content API keys, is fully cacheable,
    and is intended to be safe for browser use.
  properties:
  - type: Documentation
    url: https://docs.ghost.org/content-api
  - type: Authentication
    url: https://docs.ghost.org/content-api#key
  - type: SDKs
    title: Ghost Content Node SDK
    url: https://github.com/TryGhost/SDK/tree/main/packages/content-api
- aid: ghost:ghost-authors-api
  name: Ghost Authors API
  description: Authors represent the staff users who create content in a Ghost publication.
  humanURL: https://docs.ghost.org/admin-api
  baseURL: https://{admin_domain}/ghost/api/admin
  tags:
  - Authors
  properties:
  - type: OpenAPI
    url: openapi/ghost-authors-api-openapi.yml
- aid: ghost:ghost-images-api
  name: Ghost Images API
  description: Upload images to the Ghost publication for use in posts, pages, and settings.
  humanURL: https://docs.ghost.org/admin-api
  baseURL: https://{admin_domain}/ghost/api/admin
  tags:
  - Images
  properties:
  - type: OpenAPI
    url: openapi/ghost-images-api-openapi.yml
- aid: ghost:ghost-members-api
  name: Ghost Members API
  description: >-
    Manage publication members including creating, reading, updating, and deleting member records. Members
    are people who have signed up for the publication.
  humanURL: https://docs.ghost.org/admin-api
  baseURL: https://{admin_domain}/ghost/api/admin
  tags:
  - Members
  properties:
  - type: OpenAPI
    url: openapi/ghost-members-api-openapi.yml
- aid: ghost:ghost-newsletters-api
  name: Ghost Newsletters API
  description: >-
    Manage email newsletters that members can subscribe to. Each newsletter has its own design, sender
    details, and subscription list.
  humanURL: https://docs.ghost.org/admin-api
  baseURL: https://{admin_domain}/ghost/api/admin
  tags:
  - Newsletters
  properties:
  - type: OpenAPI
    url: openapi/ghost-newsletters-api-openapi.yml
- aid: ghost:ghost-offers-api
  name: Ghost Offers API
  description: >-
    Manage promotional offers for paid membership tiers, including discounts and trial periods.
  humanURL: https://docs.ghost.org/admin-api
  baseURL: https://{admin_domain}/ghost/api/admin
  tags:
  - Offers
  properties:
  - type: OpenAPI
    url: openapi/ghost-offers-api-openapi.yml
- aid: ghost:ghost-pages-api
  name: Ghost Pages API
  description: >-
    Create, read, update, and delete pages. Pages share the same structure as posts but are used for static
    content.
  humanURL: https://docs.ghost.org/admin-api
  baseURL: https://{admin_domain}/ghost/api/admin
  tags:
  - Pages
  properties:
  - type: OpenAPI
    url: openapi/ghost-pages-api-openapi.yml
- aid: ghost:ghost-posts-api
  name: Ghost Posts API
  description: >-
    Create, read, update, and delete posts. Posts are the primary content resource in Ghost and support
    rich content via the Lexical editor format.
  humanURL: https://docs.ghost.org/admin-api
  baseURL: https://{admin_domain}/ghost/api/admin
  tags:
  - Posts
  properties:
  - type: OpenAPI
    url: openapi/ghost-posts-api-openapi.yml
- aid: ghost:ghost-settings-api
  name: Ghost Settings API
  description: >-
    Settings provide access to global publication settings including title, description, navigation, and
