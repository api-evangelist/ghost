- aid: ghost:ghost-themes-api
  name: Ghost Themes API
  description: >-
    Upload, activate, and manage themes that control the front-end appearance of the Ghost publication.
  humanURL: https://docs.ghost.org/admin-api
  baseURL: https://{admin_domain}/ghost/api/admin
  tags:
  - Themes
  properties:
  - type: OpenAPI
    url: openapi/ghost-themes-api-openapi.yml
- aid: ghost:ghost-tiers-api
  name: Ghost Tiers API
  description: >-
    Manage membership tiers including creating, reading, and updating tier configurations with pricing
